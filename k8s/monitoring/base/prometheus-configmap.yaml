apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Static target instead of Kubernetes service-discovery: keeps this
      # deployment RBAC-free and lightweight. See docs/monitoring.md for the
      # kube-prometheus-stack (ServiceMonitor-based auto-discovery) upgrade path.
      - job_name: ha-app
        metrics_path: /metrics
        static_configs:
          - targets: ["ha-app.app.svc.cluster.local:80"]
