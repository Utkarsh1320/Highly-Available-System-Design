# 1. Deny everything in the namespace by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2. Allow only ingress-nginx and Prometheus (monitoring) to reach the pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-and-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ha-app
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 3000
          protocol: TCP
---
# 3. Allow egress to DNS (kube-dns) for the pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ha-app
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# 4. Allow egress to the RDS database.
# note: Replace <rds-endpoint> with the actual RDS endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-rds
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ha-app
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.30.0.0/24
      ports:
        - port: 5432
          protocol: TCP
