global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 2


frontend public
    bind *:9000
    default_backend ha_app_cluster

backend ha_app_cluster

    http-request set-header Host ha-app.local

    option httpchk GET /healthz
    http-check send hdr Host ha-app.local
    http-check expect status 200
    default-server inter 2s fall 2 rise 2

    server hot     a57dfa5556ed64c6ead928d7e7a8f440-4754e049351712bd.elb.us-east-1.amazonaws.com:80   check
    server standby a486a87c1650344fb87a37a4c03c861f-01e0fa811841c718.elb.us-west-2.amazonaws.com:80    backup check

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
