global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 2

# Local demo stand-in for the "Virtual-IP" in front of the LB tier. In
# production this whole HAProxy instance sits behind Route53 health-check
# failover + a floating VIP (keepalived/VRRP) across a primary/backup pair
# of these instances — see docs/failover.md for that fuller picture, which
# isn't reproducible on a single Docker host.
frontend public
    bind *:9000
    default_backend ha_app_cluster

backend ha_app_cluster
    # Both clusters' Ingress resources answer on this shared hostname
    # regardless of which cluster is actually serving the request, so
    # HAProxy can always send one consistent Host header.
    http-request set-header Host ha-app.local

    option httpchk GET /healthz
    http-check send hdr Host ha-app.local
    http-check expect status 200
    default-server inter 2s fall 2 rise 2

    # hot is primary; standby only receives traffic once hot fails its
    # active health check (2 consecutive failures @ 2s interval = ~4s to
    # detect), and traffic returns to hot automatically once it recovers
    # (2 consecutive successes).
    server hot     127.0.0.1:80   check
    server standby 127.0.0.1:8080 backup check

# HAProxy's built-in stats page — useful to watch failover happen live.
frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
