global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 2


frontend public
    bind *:9000
    default_backend ha_app_cluster

backend ha_app_cluster

    http-request set-header Host ha-app.local

    option httpchk GET /healthz
    http-check send hdr Host ha-app.local
    http-check expect status 200
    default-server inter 2s fall 2 rise 2

    
    server hot     127.0.0.1:80   check
    server standby 127.0.0.1:8080 backup check

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
