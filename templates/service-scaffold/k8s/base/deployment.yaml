apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SERVICE_NAME__
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: __SERVICE_NAME__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __SERVICE_NAME__
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "__PORT__"
        prometheus.io/path: "__METRICS_PATH__"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerhub-creds
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: __SERVICE_NAME__
      containers:
        - name: __SERVICE_NAME__
          image: __IMAGE__:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: __PORT__
          envFrom:
            - configMapRef:
                name: __SERVICE_NAME__-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: __HEALTHZ_PATH__
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: __READYZ_PATH__
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            # runAsUser/runAsGroup: <fill in your image's non-root UID/GID —
            # e.g. `docker run --rm __IMAGE__:local id`. Without these,
            # runAsNonRoot fails if your image's USER is a name rather than
            # a numeric UID (kubelet can't verify non-root without one).
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
