name: CI/CD


on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGE_NAME: docker.io/utkarsh1320/ha-app

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  build-and-push:
    name: Build & Push Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (runtime target, tagged by commit SHA + latest)
        uses: docker/build-push-action@v6
        with:
          context: app
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-standby:
    name: Deploy to Standby (canary)
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_STANDBY }}" | base64 -d > "$HOME/.kube/config"

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/standby

      - name: Roll out new image
        run: |
          kubectl -n app set image deployment/ha-app \
            ha-app=${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          kubectl -n app rollout status deployment/ha-app --timeout=120s

      - name: Smoke test
        run: |
          kubectl -n app run smoke-test-standby --rm -i --restart=Never --image=busybox:1.36 --timeout=30s -- \
            wget -qO- --timeout=5 http://ha-app/healthz

      - name: Roll back on failure
        if: failure()
        run: kubectl -n app rollout undo deployment/ha-app

  deploy-hot:
    name: Deploy to Hot
    needs: [build-and-push, deploy-standby]
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_HOT }}" | base64 -d > "$HOME/.kube/config"

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/hot

      - name: Roll out new image
        run: |
          kubectl -n app set image deployment/ha-app \
            ha-app=${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          kubectl -n app rollout status deployment/ha-app --timeout=120s

      - name: Smoke test
        run: |
          kubectl -n app run smoke-test-hot --rm -i --restart=Never --image=busybox:1.36 --timeout=30s -- \
            wget -qO- --timeout=5 http://ha-app/healthz

      - name: Roll back on failure
        if: failure()
        run: kubectl -n app rollout undo deployment/ha-app
