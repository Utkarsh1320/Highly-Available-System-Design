# Real node inventory for OS-level hardening (node_hardening role).
# Update these with your actual hot-cluster server IPs.
[control_plane]
hot-control-plane ansible_host=192.168.56.10

[workers]
hot-worker1 ansible_host=192.168.56.11
hot-worker2 ansible_host=192.168.56.12

[k8s_cluster:children]
control_plane
workers

[k8s_cluster:vars]
cluster_name=hot
cluster_role=hot
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

# cluster_platform role runs locally against the cluster's kubeconfig context,
# not over SSH — no remote host needed, just the kube_context var below.
# Left without an explicit ansible_python_interpreter so ansible.cfg's
# auto-detection is used for whatever Python is running Ansible locally.
[local]
localhost ansible_connection=local

[all:vars]
kube_context=kind-hot
# kind's kubelet certs aren't signed for metrics-server's default validation.
# Set to false when kube_context points at a real production cluster.
cluster_platform_kubelet_insecure_tls=true
