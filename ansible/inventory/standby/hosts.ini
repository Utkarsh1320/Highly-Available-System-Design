# Real node inventory for OS-level hardening (node_hardening role).
# Update these with your actual standby-cluster server IPs.
[control_plane]
standby-control-plane ansible_host=192.168.57.10

[workers]
standby-worker1 ansible_host=192.168.57.11
standby-worker2 ansible_host=192.168.57.12

[k8s_cluster:children]
control_plane
workers

[k8s_cluster:vars]
cluster_name=standby
cluster_role=standby
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

# cluster_platform role runs locally against the cluster's kubeconfig context,
# not over SSH — no remote host needed, just the kube_context var below.
[local]
localhost ansible_connection=local

[all:vars]
kube_context=kind-standby
# kind's kubelet certs aren't signed for metrics-server's default validation.
# Set to false when kube_context points at a real production cluster.
cluster_platform_kubelet_insecure_tls=true

cluster_platform_pin_ingress_nginx_to_control_plane=true
