---

- name: Ensure platform namespace exists
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'namespace.yaml.j2') | from_yaml }}"

- name: Apply ResourceQuota
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'resourcequota.yaml.j2') | from_yaml }}"

- name: Apply LimitRange
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'limitrange.yaml.j2') | from_yaml }}"


- name: Ensure monitoring namespace exists
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'monitoring-namespace.yaml.j2') | from_yaml }}"

- name: Look up the kube-apiserver Service (ClusterIP varies per cluster)
  kubernetes.core.k8s_info:
    kind: Service
    name: kubernetes
    namespace: default
    context: "{{ kube_context }}"
  register: cluster_platform_apiserver_svc

- name: Set apiserver connection facts for NetworkPolicy egress rules
  ansible.builtin.set_fact:
    cluster_platform_apiserver_ip: "{{ cluster_platform_apiserver_svc.resources[0].spec.clusterIP }}"
    cluster_platform_apiserver_port: "{{ cluster_platform_apiserver_svc.resources[0].spec.ports[0].port }}"

- name: Apply default-deny NetworkPolicy for the monitoring namespace
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'networkpolicy-monitoring-default-deny.yaml.j2') | from_yaml }}"

- name: Allow DNS egress in the monitoring namespace
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'networkpolicy-monitoring-allow-dns.yaml.j2') | from_yaml }}"

- name: Allow intra-namespace traffic within monitoring (Grafana<->Prometheus/Loki, Promtail->Loki)
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'networkpolicy-monitoring-allow-intra-namespace.yaml.j2') | from_yaml }}"

- name: Allow ingress from ingress-nginx to Grafana
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'networkpolicy-monitoring-allow-ingress-nginx.yaml.j2') | from_yaml }}"

- name: Allow Prometheus egress to the app namespace for scraping
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'networkpolicy-monitoring-allow-egress-app.yaml.j2') | from_yaml }}"

- name: Allow Promtail egress to the kube-apiserver for pod discovery
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'networkpolicy-monitoring-allow-apiserver.yaml.j2') | from_yaml }}"

- name: Apply developer Role
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'rbac-developer-role.yaml.j2') | from_yaml }}"

- name: Apply developer RoleBinding
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    definition: "{{ lookup('template', 'rbac-developer-rolebinding.yaml.j2') | from_yaml }}"

- name: Check whether metrics-server is already installed
  kubernetes.core.k8s_info:
    kind: Deployment
    name: metrics-server
    namespace: kube-system
    context: "{{ kube_context }}"
  register: cluster_platform_metrics_server

- name: Install metrics-server (required for the app's HorizontalPodAutoscaler)
  kubernetes.core.k8s:
    state: present
    context: "{{ kube_context }}"
    src: "{{ metrics_server_manifest_url }}"
  when: cluster_platform_metrics_server.resources | length == 0


- name: Re-check metrics-server args after ensuring it exists
  kubernetes.core.k8s_info:
    kind: Deployment
    name: metrics-server
    namespace: kube-system
    context: "{{ kube_context }}"
  register: cluster_platform_metrics_server_current
  when: cluster_platform_kubelet_insecure_tls | bool

- name: Patch metrics-server for kubelet TLS used by local/kind clusters
  kubernetes.core.k8s_json_patch:
    kind: Deployment
    name: metrics-server
    namespace: kube-system
    context: "{{ kube_context }}"
    patch:
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
  when:
    - cluster_platform_kubelet_insecure_tls | bool
    - >-
      '--kubelet-insecure-tls' not in
      cluster_platform_metrics_server_current.resources[0].spec.template.spec.containers[0].args

- name: Verify the Nginx ingress controller assumed by the brief is actually present
  kubernetes.core.k8s_info:
    kind: Deployment
    name: ingress-nginx-controller
    namespace: "{{ ingress_nginx_namespace }}"
    context: "{{ kube_context }}"
  register: cluster_platform_ingress_nginx

- name: Fail fast if the assumed Nginx ingress controller is missing
  ansible.builtin.fail:
    msg: >-
      No ingress-nginx-controller Deployment found in namespace
      {{ ingress_nginx_namespace }} on context {{ kube_context }}.
      The assignment assumes this is already configured — install it before
      re-running this playbook.
  when: cluster_platform_ingress_nginx.resources | length == 0

- name: Pin ingress-nginx-controller to the control-plane node (kind only)
  kubernetes.core.k8s_json_patch:
    kind: Deployment
    name: ingress-nginx-controller
    namespace: "{{ ingress_nginx_namespace }}"
    context: "{{ kube_context }}"
    patch:
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/os: linux
          ingress-ready: "true"
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Equal
            effect: NoSchedule
  when:
    - cluster_platform_pin_ingress_nginx_to_control_plane | bool
    - cluster_platform_ingress_nginx.resources | length > 0
    - >-
      'ingress-ready' not in
      (cluster_platform_ingress_nginx.resources[0].spec.template.spec.nodeSelector | default({}))
